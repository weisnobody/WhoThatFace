<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Person faces</title>
  <style>
    body { font: 14px system-ui; margin: 20px; color: #222 }
    .page-header { position: sticky; top: 0; z-index: 10; background: #fff; padding: 10px 0; border-bottom: 1px solid #ccc }
    .grid { display: flex; flex-wrap: wrap; gap: 18px }
    .card { width: min(420px, 45vw); border: 1px solid #ccc; padding: 10px }
    .viewer { position: relative; display: inline-block; max-width: 100% }
    .viewer img { max-width: 100%; max-height: 55vh }
    .box { position: absolute; border: 2px solid #f00; background: rgba(204, 0, 0, 0.15); pointer-events: none }
    .box.reference { border-color: #0a2; background: rgba(0, 170, 34, 0.15) }
    .path { margin-top: 8px; overflow-wrap: anywhere }
    .actions { display: flex; justify-content: space-between; margin-top: 8px }
  </style>
</head>
<body>
  <div class="page-header"><h1 id="title">Person</h1></div>
  <div id="photos" class="grid"></div>
  <script>
    const personId = location.pathname.split('/')[2];
    const api = (url, options) => fetch(url, options).then(r => r.json());
    function render(data) {
      document.title = data.person.label;
      const referenceCount = data.person.reference_count ?? data.photos.filter(photo => photo.role === 'reference').length;
      document.getElementById('title').textContent = `${data.person.label} (${data.photos.length} faces, ${referenceCount} references)`;
      document.getElementById('photos').innerHTML = data.photos.map(photo => {
        const b = [photo.x1, photo.y1, photo.x2, photo.y2];
        const box = `<span class="box ${photo.role === 'reference' ? 'reference' : ''}" style="left:${b[0]/photo.width*100}%;top:${b[1]/photo.height*100}%;width:${(b[2]-b[0])/photo.width*100}%;height:${(b[3]-b[1])/photo.height*100}%"></span>`;
        return `<article class="card" id="face-${photo.face_id}">
          <div class="viewer"><img src="/image/${photo.image_id}">${box}</div>
          <div class="path">${photo.relative_path}</div>
          <div class="actions"><button onclick="removeAssignment(${photo.face_id})">Remove assignment</button><button onclick="toggleRole(${photo.face_id}, '${photo.role}')">Make ${photo.role === 'reference' ? 'evaluation' : 'reference'}</button></div>
        </article>`;
      }).join('') || '<p>No faces are assigned to this person.</p>';
    }
    function load() { return api(`/api/person/${personId}/photos`).then(data => data.error ? alert(data.error) : render(data)); }
    function removeAssignment(faceId) {
      api('/api/unassign', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({face_id:faceId})})
        .then(result => result.error ? alert(result.error) : load());
    }
    function toggleRole(faceId, role) {
      const nextRole = role === 'reference' ? 'evaluation' : 'reference';
      api('/api/set-role', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({face_id:faceId, role:nextRole})})
        .then(result => result.error ? alert(result.error) : load());
    }
    load();
  </script>
</body>
</html>
